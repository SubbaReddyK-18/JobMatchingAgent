<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Briefcase Body Gradient -->
    <linearGradient id="briefcaseGrad" x1="20" y1="50" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="80" y1="10" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="60%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- 0. White Die-Cut Sticker Outer Border -->
    <rect x="26" y="58" width="148" height="114" rx="28" fill="#FFFFFF" />
    <path d="M72 65 C72 42 128 42 128 65" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" fill="none" />
    <path d="M125 15 L70 95 L106 95 L72 170 L145 78 L108 78 Z" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" fill="#FFFFFF" />

    <!-- 1. Handle -->
    <path d="M75 66 C75 48 125 48 125 66" stroke="#000000" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M75 66 C75 52 125 52 125 66" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M78 63 C82 55 118 55 122 63" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- 2. Briefcase Outer Shadow & Black Outline -->
    <rect x="34" y="66" width="132" height="98" rx="20" fill="#000000" stroke="#000000" stroke-width="8" stroke-linejoin="round" />

    <!-- 3. Briefcase Base Body -->
    <rect x="36" y="68" width="128" height="94" rx="18" fill="url(#briefcaseGrad)" />

    <!-- 4. Briefcase Flap Line (Horizontal) -->
    <path d="M38 108 L162 108" stroke="#000000" stroke-width="7" stroke-linecap="round" />

    <!-- 5. Cyan Neon Inner Border Trim -->
    <rect x="42" y="74" width="116" height="82" rx="14" fill="none" stroke="#00F0FF" stroke-width="5" opacity="0.95" />
    <path d="M42 104 L158 104" stroke="#00F0FF" stroke-width="4" opacity="0.9" />

    <!-- 6. Neon Lime Clasps -->
    <!-- Left Clasp -->
    <rect x="58" y="94" width="18" height="28" rx="7" fill="#000000" />
    <rect x="60" y="96" width="14" height="24" rx="5" fill="#CCFF00" stroke="#84CC16" stroke-width="1.5" />
    <rect x="63" y="100" width="8" height="8" rx="2" fill="#00F0FF" />

    <!-- Right Clasp -->
    <rect x="124" y="94" width="18" height="28" rx="7" fill="#000000" />
    <rect x="126" y="96" width="14" height="24" rx="5" fill="#CCFF00" stroke="#84CC16" stroke-width="1.5" />
    <rect x="129" y="100" width="8" height="8" rx="2" fill="#00F0FF" />

    <!-- 7. Briefcase Glossy Highlights -->
    <path d="M46 80 C56 76 90 76 96 76" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.65" />
    <path d="M152 140 C152 148 148 152 140 152" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- 8. Lightning Bolt Pink 3D Shadow Layer -->
    <path d="M129 23 L73 99 L109 99 L75 168 L146 82 L111 82 Z" fill="#EC4899" stroke="#000000" stroke-width="10" stroke-linejoin="round" />

    <!-- 9. Lightning Bolt Main Body (Electric Neon Lime) -->
    <path d="M125 18 L69 94 L105 94 L71 163 L142 77 L107 77 Z" fill="url(#boltGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />

    <!-- 10. Lightning Bolt Glossy Gel Highlights -->
    <path d="M120 25 L80 88" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
    <path d="M102 98 L80 148" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <circle cx="106" cy="85" r="2.5" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
